name: "Deploy pages"

on:
  push:
    branches:
    - 'master'
  workflow_dispatch:
    inputs:
      reason:
        default: "Manual trigger"

jobs:
  Build-n-Deploy:
    name: Build and deploy Lektor websites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install "Lektor>=3.3.4"
          pip install "pagefind[extended]"
          pip install beautifulsoup4
          pip install requests
          pip freeze
      - name: Deploy
        env:
          ABOUT_SSH_PRIVATE_KEY: ${{ secrets.ABOUT_SSH_PRIVATE_KEY }}
          BLOG_SSH_PRIVATE_KEY: ${{ secrets.BLOG_SSH_PRIVATE_KEY }}
          HELP_SSH_PRIVATE_KEY: ${{ secrets.HELP_SSH_PRIVATE_KEY }}
        run: ./rundeploy.sh
